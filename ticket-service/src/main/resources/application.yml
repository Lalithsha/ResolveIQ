server:
  port: 8082

spring:
  application:
    name: ticket-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resolveiq}
    username: ${SPRING_DATASOURCE_USERNAME:resolveiq_app}
    password: ${SPRING_DATASOURCE_PASSWORD:local_dev_password_change_in_prod}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ticket_schema
  flyway:
    enabled: true
    schemas: ticket_schema
    default-schema: ticket_schema
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: resolveiq-ticket-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.resolveiq.contracts.*"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

resolveiq:
  attachments:
    enabled: ${RESOLVEIQ_ATTACHMENTS_ENABLED:true}
    storage: ${RESOLVEIQ_ATTACHMENTS_STORAGE:minio}
    scanner: ${RESOLVEIQ_ATTACHMENTS_SCANNER:deterministic}
    max-bytes: ${RESOLVEIQ_ATTACHMENTS_MAX_BYTES:10485760}
    max-files-per-ticket: ${RESOLVEIQ_ATTACHMENTS_MAX_FILES:5}
    minio:
      endpoint: ${RESOLVEIQ_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:resolveiq_minio_dev_access}
      secret-key: ${MINIO_SECRET_KEY:resolveiq_minio_dev_secret_key_12345}
      bucket: ${RESOLVEIQ_MINIO_BUCKET:resolveiq-attachments}
    clamav:
      host: ${RESOLVEIQ_CLAMAV_HOST:localhost}
      port: ${RESOLVEIQ_CLAMAV_PORT:3310}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
