services:
  # ============================================================================
  # Core Infrastructure Services (Profile: infra / default)
  # ============================================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: resolveiq-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resolveiq}
      POSTGRES_USER: ${POSTGRES_USER:-resolveiq_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password_change_in_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveiq_app -d resolveiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: resolveiq-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data-v2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: resolveiq-kafka-console
    ports:
      - "${KAFKA_CONSOLE_PORT:-8090}:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: resolveiq-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-resolveiq_minio_dev_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-resolveiq_minio_dev_secret_key_12345}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================================
  # Application Services (Profile: app)
  # ============================================================================

  discovery-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      target: dev
      args:
        SERVICE_NAME: discovery-service
    container_name: resolveiq-discovery
    profiles: ["app"]
    ports:
      - "${DISCOVERY_PORT:-8761}:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEV_SERVICE_NAME: discovery-service
    volumes:
      - .:/workspace
      - /workspace/discovery-service/target
      - /workspace/common-contracts/target
      - /workspace/common-security/target
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      target: dev
      args:
        SERVICE_NAME: api-gateway
    container_name: resolveiq-gateway
    profiles: ["app"]
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEV_SERVICE_NAME: api-gateway
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      RESOLVEIQ_JWT_SECRET: ${RESOLVEIQ_JWT_SECRET:-fictional_jwt_hmac_secret_key_minimum_256_bits_for_local_development_only_12345}
    volumes:
      - .:/workspace
      - /workspace/api-gateway/target
      - /workspace/common-contracts/target
      - /workspace/common-security/target
      - maven-cache:/root/.m2
    depends_on:
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  auth-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      target: dev
      args:
        SERVICE_NAME: auth-service
    container_name: resolveiq-auth
    profiles: ["app"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEV_SERVICE_NAME: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/resolveiq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      RESOLVEIQ_JWT_SECRET: ${RESOLVEIQ_JWT_SECRET:-fictional_jwt_hmac_secret_key_minimum_256_bits_for_local_development_only_12345}
    volumes:
      - .:/workspace
      - /workspace/auth-service/target
      - /workspace/common-contracts/target
      - /workspace/common-security/target
      - maven-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  ticket-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      target: dev
      args:
        SERVICE_NAME: ticket-service
    container_name: resolveiq-ticket
    profiles: ["app"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEV_SERVICE_NAME: ticket-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/resolveiq
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      RESOLVEIQ_JWT_SECRET: ${RESOLVEIQ_JWT_SECRET:-fictional_jwt_hmac_secret_key_minimum_256_bits_for_local_development_only_12345}
      RESOLVEIQ_MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-resolveiq_minio_dev_access}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-resolveiq_minio_dev_secret_key_12345}
      RESOLVEIQ_ATTACHMENTS_SCANNER: deterministic
    volumes:
      - .:/workspace
      - /workspace/ticket-service/target
      - /workspace/common-contracts/target
      - /workspace/common-security/target
      - maven-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  ai-orchestration-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      target: dev
      args:
        SERVICE_NAME: ai-orchestration-service
    container_name: resolveiq-orchestration
    profiles: ["app"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEV_SERVICE_NAME: ai-orchestration-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/resolveiq
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      RESOLVEIQ_JWT_SECRET: ${RESOLVEIQ_JWT_SECRET:-fictional_jwt_hmac_secret_key_minimum_256_bits_for_local_development_only_12345}
      RESOLVEIQ_SERVICES_ANALYSIS_URL: http://ai-analysis-service:8084
      RESOLVEIQ_SERVICES_ROUTING_URL: http://routing-service:8085
      RESOLVEIQ_SERVICES_RAG_URL: http://rag-service:8086
    volumes:
      - .:/workspace
      - /workspace/ai-orchestration-service/target
      - /workspace/common-contracts/target
      - /workspace/common-security/target
      - maven-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ai-analysis-service:
        condition: service_healthy
      routing-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  ai-analysis-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      target: dev
      args:
        SERVICE_NAME: ai-analysis-service
    container_name: resolveiq-analysis
    profiles: ["app"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEV_SERVICE_NAME: ai-analysis-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/resolveiq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      RESOLVEIQ_JWT_SECRET: ${RESOLVEIQ_JWT_SECRET:-fictional_jwt_hmac_secret_key_minimum_256_bits_for_local_development_only_12345}
    volumes:
      - .:/workspace
      - /workspace/ai-analysis-service/target
      - /workspace/common-contracts/target
      - /workspace/common-security/target
      - maven-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  routing-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      target: dev
      args:
        SERVICE_NAME: routing-service
    container_name: resolveiq-routing
    profiles: ["app"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEV_SERVICE_NAME: routing-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/resolveiq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      RESOLVEIQ_JWT_SECRET: ${RESOLVEIQ_JWT_SECRET:-fictional_jwt_hmac_secret_key_minimum_256_bits_for_local_development_only_12345}
    volumes:
      - .:/workspace
      - /workspace/routing-service/target
      - /workspace/common-contracts/target
      - /workspace/common-security/target
      - maven-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  rag-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      target: dev
      args:
        SERVICE_NAME: rag-service
    container_name: resolveiq-rag
    profiles: ["app"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEV_SERVICE_NAME: rag-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/resolveiq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      RESOLVEIQ_JWT_SECRET: ${RESOLVEIQ_JWT_SECRET:-fictional_jwt_hmac_secret_key_minimum_256_bits_for_local_development_only_12345}
    volumes:
      - .:/workspace
      - /workspace/rag-service/target
      - /workspace/common-contracts/target
      - /workspace/common-security/target
      - maven-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      target: dev
    container_name: resolveiq-frontend
    profiles: ["app"]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      API_PROXY_TARGET: http://api-gateway:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api-gateway:
        condition: service_healthy

  # ============================================================================
  # Observability Stack (Profile: observability)
  # ============================================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: resolveiq-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/compose/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: resolveiq-prometheus
    profiles: ["observability"]
    volumes:
      - ./infra/compose/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/compose/prometheus/alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: resolveiq-grafana
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/compose/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./infra/compose/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  kafka-data:
  kafka-data-v2:
  minio-data:
  maven-cache:
