server:
  port: 8085

spring:
  application:
    name: routing-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resolveiq}
    username: ${SPRING_DATASOURCE_USERNAME:resolveiq_app}
    password: ${SPRING_DATASOURCE_PASSWORD:local_dev_password_change_in_prod}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: routing_schema
  flyway:
    enabled: true
    schemas: routing_schema
    default-schema: routing_schema
    create-schemas: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
