<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">ResolveIQ — AI assists. Humans stay in control.</title>
  <desc id="desc">A customer-support portfolio project. A traceable workflow connects a customer issue, supporting evidence, human approval and a confirmed outcome.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8faf5"/><stop offset="1" stop-color="#e8f1eb"/></linearGradient>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="418" rx="23" fill="none" stroke="#d5e2d8"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="60" y="52" width="60" height="60" rx="15" fill="#396959"/>
    <text x="90" y="94" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">R</text>
    <text x="140" y="98" fill="#24382e" font-size="49" font-weight="700" letter-spacing="-1.5">ResolveIQ</text>
    <text x="62" y="158" fill="#526158" font-size="15" font-weight="700" letter-spacing="2">AI-ASSISTED CUSTOMER SUPPORT</text>
    <text x="60" y="229" fill="#24382e" font-size="48" font-weight="700" letter-spacing="-1.4">AI assists.</text>
    <text x="60" y="287" fill="#396959" font-size="48" font-weight="700" letter-spacing="-1.4">Humans stay in control.</text>
    <text x="62" y="334" fill="#526158" font-size="21">Evidence-backed answers. Approved actions.</text>
    <text x="62" y="374" fill="#526158" font-size="17">Java · Spring Boot · Kafka · PostgreSQL / pgvector · React</text>
    <text x="820" y="57" fill="#526158" font-size="13" font-weight="700" letter-spacing="1.5">A TRACEABLE SUPPORT WORKFLOW</text>
    <path d="M799 119V322" stroke="#97b9a6" stroke-width="2"/>
    <g fill="#fff" stroke="#cbdcd1">
      <rect x="766" y="77" width="446" height="67" rx="13"/>
      <rect x="766" y="159" width="446" height="67" rx="13"/>
      <rect x="766" y="241" width="446" height="67" rx="13"/>
