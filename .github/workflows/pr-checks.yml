name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-validation:
    name: Validate PR Conventions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Architecture Decoupling
        run: |
          echo "Verifying no cross-schema database access in services..."
          ! grep -rIn "auth_schema" ticket-service/src/ || exit 1
          ! grep -rIn "ticket_schema" auth-service/src/ || exit 1
          echo "✔ Service isolation verified."
