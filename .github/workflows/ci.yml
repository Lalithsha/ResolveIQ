name: ResolveIQ CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Build & Test All Modules
        run: ./mvnw clean verify

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm --prefix frontend ci

      - name: Lint Frontend Code
        run: npm --prefix frontend run lint

      - name: Run Frontend Tests
        run: npm --prefix frontend run test

      - name: Typecheck and Build
        run: npm --prefix frontend run build

  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Secret Scan
        run: |
          chmod +x scripts/scan-secrets.sh
          ./scripts/scan-secrets.sh

  browser-acceptance:
    name: Six-Role Browser Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend-build, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start Complete ResolveIQ Stack
        run: docker compose --profile app up -d --build --wait --wait-timeout 420

      - name: Seed Lifecycle and Demo Data
        run: ./scripts/seed-data.sh

      - name: Run Role Journeys
        run: npm --prefix frontend run test:e2e

      - name: Capture Service Logs on Failure
        if: failure()
        run: docker compose --profile app logs --no-color --tail=250

      - name: Upload Browser Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop Stack
        if: always()
        run: docker compose --profile app down --volumes --remove-orphans
