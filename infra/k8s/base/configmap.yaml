apiVersion: v1
kind: ConfigMap
metadata:
  name: resolveiq-runtime
data:
  SPRING_PROFILES_ACTIVE: production
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql.database.svc.cluster.local:5432/resolveiq
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka.messaging.svc.cluster.local:9092
  RESOLVEIQ_MINIO_ENDPOINT: http://minio.storage.svc.cluster.local:9000
  RESOLVEIQ_ATTACHMENTS_STORAGE: minio
  RESOLVEIQ_ATTACHMENTS_SCANNER: clamav
  RESOLVEIQ_CLAMAV_HOST: clamav.security.svc.cluster.local
  RESOLVEIQ_CLAMAV_PORT: "3310"
  RESOLVEIQ_SERVICES_ANALYSIS_URL: http://ai-analysis-service:8084
  RESOLVEIQ_SERVICES_ROUTING_URL: http://routing-service:8085
  RESOLVEIQ_SERVICES_RAG_URL: http://rag-service:8086
  RESOLVEIQ_AI_CHAT_PROVIDER: openai-compatible
  RESOLVEIQ_AI_BASE_URL: https://api.openai.com/v1
