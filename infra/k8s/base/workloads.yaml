apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: discovery-service }
  template:
    metadata:
      labels: { app: discovery-service }
    spec:
      containers:
        - name: app
          image: ghcr.io/replace-me/resolveiq-discovery-service:1.0.0
          ports: [{ name: http, containerPort: 8761 }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe: &discovery-probe
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe: *discovery-probe
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
spec:
  selector: { app: discovery-service }
  ports: [{ name: http, port: 8761, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: app
          image: ghcr.io/replace-me/resolveiq-api-gateway:1.0.0
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: resolveiq-runtime }
            - secretRef: { name: resolveiq-runtime-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe: &app-probe
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe: *app-probe
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: { app: api-gateway }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
