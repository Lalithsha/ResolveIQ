global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'resolveiq-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8080' # API Gateway
          - 'host.docker.internal:8081' # Auth Service
          - 'host.docker.internal:8082' # Ticket Service
          - 'host.docker.internal:8083' # Orchestration Service
          - 'host.docker.internal:8084' # Analysis Service
          - 'host.docker.internal:8085' # Routing Service
          - 'host.docker.internal:8086' # RAG Service
